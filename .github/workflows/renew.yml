name: Katabump Auto Renew

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [tg_manual_renew]

jobs:
  renew_job:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable xvfb
          
          # 获取 Chrome 版本
          CHROME_VERSION=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+\.\d+')
          echo "Chrome version: $CHROME_VERSION"
          
          # 获取主版本号
          CHROME_MAJOR=$(echo $CHROME_VERSION | cut -d. -f1)
          echo "Chrome major version: $CHROME_MAJOR"
          
          # 下载对应版本的 ChromeDriver
          wget -q "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}/linux64/chromedriver-linux64.zip" -O /tmp/chromedriver.zip || \
          wget -q "https://edgedl.me.gvt1.com/edgedl/chrome/chrome-for-testing/${CHROME_VERSION}/linux64/chromedriver-linux64.zip" -O /tmp/chromedriver.zip
          
          # 解压并安装
          sudo unzip -o /tmp/chromedriver.zip -d /tmp/
          sudo mv /tmp/chromedriver-linux64/chromedriver /usr/local/bin/
          sudo chmod +x /usr/local/bin/chromedriver
          
          # 验证版本
          chromedriver --version

      - name: Install Python Dependencies
        run: pip install requests undetected-chromedriver selenium

      - name: Run Renew Script
        env:
          KB_ACCOUNTS_JSON: ${{ secrets.KB_ACCOUNTS_JSON }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RUN_TRIGGER_SOURCE: ${{ github.event_name }}
        run: xvfb-run -a python -u main.py
