name: Katabump Auto Renew

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [tg_manual_renew]

jobs:
  renew_job:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Chrome, Xvfb and ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable xvfb unzip wget

          CHROME_VERSION=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+\.\d+')
          echo "Chrome version: $CHROME_VERSION"

          mkdir -p "$HOME/chromedriver"
          wget -q "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}/linux64/chromedriver-linux64.zip" -O /tmp/chromedriver.zip || \
          wget -q "https://edgedl.me.gvt1.com/edgedl/chrome/chrome-for-testing/${CHROME_VERSION}/linux64/chromedriver-linux64.zip" -O /tmp/chromedriver.zip

          unzip -o /tmp/chromedriver.zip -d /tmp/
          mv /tmp/chromedriver-linux64/chromedriver "$HOME/chromedriver/"
          chmod +x "$HOME/chromedriver/chromedriver"
          "$HOME/chromedriver/chromedriver" --version

      - name: Install Python Dependencies
        run: pip install requests undetected-chromedriver selenium

      - name: Run Renew Script
        env:
          KB_ACCOUNTS_JSON: ${{ secrets.KB_ACCOUNTS_JSON }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RUN_TRIGGER_SOURCE: ${{ github.event_name }}
        run: xvfb-run -a python -u main.py
