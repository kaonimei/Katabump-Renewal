name: Katabump Auto Renew

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [tg_manual_renew]

jobs:
  renew_job:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable xvfb

      - name: Install Python Dependencies
        run: pip install requests undetected-chromedriver selenium

      - name: Run Renew Script
        env:
          KB_ACCOUNTS_JSON: ${{ secrets.KB_ACCOUNTS_JSON }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RUN_TRIGGER_SOURCE: ${{ github.event_name }}
        run: xvfb-run -a python -u main.py
