name: Katabump Auto Renew

on:
  schedule:
    - cron: '0 12 * * *'   # UTC 12:00 = 北京时间 20:00
  workflow_dispatch:
  repository_dispatch:
    types: [tg_manual_renew]

jobs:
  renew_job:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Dependencies
        run: pip install DrissionPage requests

      - name: Run Renew Script
        env:
          KB_ACCOUNTS_JSON: ${{ secrets.KB_ACCOUNTS_JSON }}
          KB_EMAIL: ${{ secrets.KB_EMAIL }}
          KB_PASSWORD: ${{ secrets.KB_PASSWORD }}
          KB_RENEW_URL: ${{ secrets.KB_RENEW_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RUN_TRIGGER_SOURCE: ${{ github.event_name }}
        run: python -u main.py
