- name: Set up Cloudflare WARP
  uses: sebst/actions-warp@v1
  with:
    tos: YES

- name: Check egress IP
  run: |
    echo "IPv4: $(curl -4 -s --max-time 10 ifconfig.me || true)"
    echo "IPv6: $(curl -6 -s --max-time 10 ifconfig.me || true)"

- name: Run Renew Script
  env:
    KB_ACCOUNTS_JSON: ${{ secrets.KB_ACCOUNTS_JSON }}
    TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
    TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
    RUN_TRIGGER_SOURCE: ${{ github.event_name }}
  run: python -u main.py
