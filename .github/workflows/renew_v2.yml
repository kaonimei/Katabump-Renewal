name: Katabump Auto Renew

on:
  schedule:
  - cron: '0 0 * * *'  # 每天执行一次（UTC 00:00 / 北京时间 08:00）
  workflow_dispatch: # 允许手动触发

jobs:
  Renew-Katabump:
    runs-on: ubuntu-latest
    permissions:
      actions: write  
      contents: read
    
    steps:
    - uses: actions/checkout@v6
    - name: ⚙ 设置 Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: 🛠️ 安装系统依赖和python依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk
        python -m pip install --upgrade pip
        pip install --disable-pip-version-check seleniumbase requests
        seleniumbase install chromedriver

    - name: ⚙ 设置代理 (sing-box)
      continue-on-error: true
      env:
        NODE_LINK: ${{ secrets.NODE_LINK }}
      run: |
        if [ -z "${NODE_LINK}" ]; then
          echo "未配置 NODE_LINK，跳过代理设置。"
          exit 0
        fi
        NODE_LINK="$(echo "${NODE_LINK}" | tr -d '\r' | xargs)"

        extract_first_proxy() {
          python - <<'PY'
        import base64
        import re
        import sys
        import urllib.parse

        text = sys.stdin.read().strip()
        if not text:
            sys.exit(0)

        schemes = ("vless", "vmess", "trojan", "tuic", "hysteria2", "hy2", "ss", "ssr", "socks5", "socks", "http", "https")
        pattern = re.compile(r'(?i)\b(?:' + "|".join(schemes) + r')://[^\s,]+')

        def find_proxy(value: str) -> str:
            value = value.strip()
            if not value:
                return ""

            match = pattern.search(value)
            if match:
                return match.group(0)

            for token in re.split(r'[\n,\s]+', value):
                token = urllib.parse.unquote(token.strip())
                if pattern.match(token):
                    return token
            return ""

        found = find_proxy(text)
        if found:
            print(found)
            sys.exit(0)

        compact = re.sub(r'\s+', '', text)
        for decoder in (base64.b64decode, base64.urlsafe_b64decode):
            try:
                padding = "=" * ((4 - (len(compact) % 4)) % 4)
                decoded = decoder((compact + padding).encode("utf-8")).decode("utf-8", errors="ignore")
            except Exception:
                continue
            found = find_proxy(decoded)
            if found:
                print(found)
                break
        PY
        }

        extracted_link="$(printf '%s' "${NODE_LINK}" | extract_first_proxy)"
        if [ -n "${extracted_link}" ]; then
          NODE_LINK="${extracted_link}"
        fi

        export NODE_LINK

        protocol="${NODE_LINK%%://*}"
        if [ "${protocol}" = "${NODE_LINK}" ]; then
          protocol="unknown"
        fi
        echo "检测到代理协议: ${protocol}"

        if [ "${protocol}" = "http" ] || [ "${protocol}" = "https" ]; then
          sub_candidate="$(curl -fsSL --connect-timeout 15 --max-time 20 "${NODE_LINK}" 2>/dev/null | tr -d '\r' | extract_first_proxy || true)"
          if [ -n "${sub_candidate}" ]; then
            NODE_LINK="${sub_candidate}"
            export NODE_LINK
            protocol="${NODE_LINK%%://*}"
            echo "检测到订阅内容，已提取首个节点协议: ${protocol}"
          fi
        fi

        if [ "${protocol}" = "vmess" ]; then
          vmess_payload="${NODE_LINK#vmess://}"
          vmess_payload="$(echo "${vmess_payload}" | tr -d '\n' | tr '_-' '/+')"
          vmess_mod=$(( ${#vmess_payload} % 4 ))
          if [ "${vmess_mod}" -ne 0 ]; then
            vmess_payload="${vmess_payload}$(printf '=%.0s' $(seq 1 $((4 - vmess_mod))))"
          fi
          if decoded_vmess="$(echo "${vmess_payload}" | base64 -d 2>/dev/null)"; then
            export NODE_LINK="vmess://$(echo -n "${decoded_vmess}" | base64 -w 0)"
            export SING_BOX_VERSION="1.12.0"
            echo "已标准化 vmess 节点并启用兼容版本: ${SING_BOX_VERSION}"
          fi
        fi

        script_urls=(
          "https://main.ssss.nyc.mn/setup_proxy.sh"
          "https://proxy-gh.ssss.nyc.mn/https://raw.githubusercontent.com/yujinlong/Build-OpenWrt/main/setup_proxy.sh"
          "https://raw.githubusercontent.com/yujinlong/Build-OpenWrt/main/setup_proxy.sh"
        )

        setup_ok=0
        for script_url in "${script_urls[@]}"; do
          echo "尝试代理初始化脚本: ${script_url}"
          if bash <(curl -fsSL --retry 2 --retry-delay 1 --connect-timeout 15 --max-time 40 "${script_url}"); then
            setup_ok=1
            break
          fi
        done

        proxy_server=""
        for candidate in "socks5://127.0.0.1:1080" "http://127.0.0.1:1081"; do
          if curl -x "${candidate}" -fsS --max-time 15 https://api.ipify.org >/dev/null 2>&1; then
            proxy_server="${candidate}"
            break
          fi
        done

        if [ -n "${proxy_server}" ]; then
          echo "检测到可用代理出口: ${proxy_server}"
          {
            echo "PROXY_SERVER=${proxy_server}"
            echo "ALL_PROXY=${proxy_server}"
            echo "HTTP_PROXY=${proxy_server}"
            echo "HTTPS_PROXY=${proxy_server}"
            echo "all_proxy=${proxy_server}"
            echo "http_proxy=${proxy_server}"
            echo "https_proxy=${proxy_server}"
          } >> "${GITHUB_ENV}"
          setup_ok=1
        fi

        if [ "${setup_ok}" -ne 1 ]; then
          echo "代理初始化失败，继续直连执行。"
        else
          echo "代理初始化完成。"
        fi

    - name: 🚀 运行续期脚本
      env:
        KATABUMP_ACCOUNTS: ${{ secrets.KATABUMP_ACCOUNTS }}
        KATABUMP_EMAIL: ${{ secrets.KATABUMP_EMAIL }}
        KATABUMP_PASSWORD: ${{ secrets.KATABUMP_PASSWORD }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        ALL_PROXY: ${{ env.ALL_PROXY }}
        HTTP_PROXY: ${{ env.HTTP_PROXY }}
        HTTPS_PROXY: ${{ env.HTTPS_PROXY }}
        all_proxy: ${{ env.all_proxy }}
        http_proxy: ${{ env.http_proxy }}
        https_proxy: ${{ env.https_proxy }}
      run: |
        if [ -z "${KATABUMP_ACCOUNTS}" ] && [ -n "${KATABUMP_EMAIL}" ] && [ -n "${KATABUMP_PASSWORD}" ]; then
          export KATABUMP_ACCOUNTS="${KATABUMP_EMAIL}:${KATABUMP_PASSWORD}"
        fi
        xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
          python3 main.py
        
    - name: 🧹 清理旧的工作流运行记录
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
        count=0
        for run_id in $runs; do
          count=$((count + 1))
          if [ $count -gt 1 ]; then
            echo "删除运行记录: $run_id"
            gh run delete $run_id || true
          fi
        done
